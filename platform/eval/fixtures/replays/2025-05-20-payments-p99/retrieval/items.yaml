items:
  - id: KI-PR-812
    source: bitbucket
    uri: "bitbucket://PAY/payments-api/pull/812"
    type: pr
    title: "PAY-PR-812: retry policy: 3→8 attempts, no jitter"
    body: |
      Change retry policy to attempt up to 8 times (was 3). Remove
      jittered backoff since it was adding 50–200ms tail. Tested
      locally with chaos toxiproxy.

      Files: src/main/java/com/example/payments/retry/RetryPolicy.java
      Diff: +12 -3
    structured:
      author: alice@example.com
      merged_at: "2025-05-20T14:15:00Z"
      reviewers: ["bob@example.com"]
      labels: ["payments", "resilience"]
    entities: [svc-payments-api, commit-a1b2c3d]
    owners: [team-payments]
    acl: { read: [team-payments, team-platform-sre] }
    embedding_stub: "[0.12, -0.04, 0.31, ...]"  # actual vectors live in pgvector

  - id: KI-COMMIT-a1b2c3d
    source: bitbucket
    uri: "bitbucket://PAY/payments-api/commit/a1b2c3d"
    type: commit
    title: "tighten retry policy: 3→8 attempts (PAY-PR-812)"
    body: |
      diff --git a/src/.../RetryPolicy.java b/src/.../RetryPolicy.java
      -  private static final int MAX_ATTEMPTS = 3;
      +  private static final int MAX_ATTEMPTS = 8;
      -  Backoff backoff = Backoff.jittered(50ms, 200ms);
      +  Backoff backoff = Backoff.fixed(50ms);
    structured:
      sha: a1b2c3d
      author: alice@example.com
      ts: "2025-05-20T13:45:00Z"
    entities: [svc-payments-api]
    acl: { read: [team-payments, team-platform-sre] }

