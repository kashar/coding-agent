  - id: KI-RUNBOOK-payments-p99
    source: confluence
    uri: "confluence://OPS/payments-runbook#p99"
    type: runbook
    title: "Runbook: payments-api p99 spike"
    body: |
      ## Triage
      1. Check recent deploys via Bamboo.
      2. Check downstream latency on auth-svc and redis-cache.
      3. If a deploy in the last 30m correlates: candidate for revert.
      4. Pageable owner: team-payments primary on-call.
    acl: { read: [team-payments, team-platform-sre] }

  - id: KI-POSTMORTEM-2024-Q4-retry
    source: confluence
    uri: "confluence://OPS/postmortems/2024-Q4-retry-storm"
    type: doc
    title: "Postmortem: 2024-Q4 retry storm on payments-api"
    body: |
      Root cause: aggressive retries (5 attempts) under partial dep
      outage created a thundering herd. Fix: introduce jittered backoff.
      Lesson: any change to MAX_ATTEMPTS upward requires load test sign-off.
    acl: { read: [team-payments, team-platform-sre] }
