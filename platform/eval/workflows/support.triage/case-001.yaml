id: support-triage-001
description: |
  S2 ticket: customer reports payment-api 500s during checkout. There is
  an active incident (alert-payments-p99) firing. Ground truth: severity
  s2, owning team payments, must correlate with active incident, draft
  must NOT promise an ETA, must NOT leak the internal root cause.

fixture_set: replays/2025-05-20-payments-customer-ticket

inputs:
  ticket_key: SUPP-9921

expected:
  triage:
    severity: s2
    owning_team: payments
    active_incident_present: true
  similar:
    count_min: 2
  draft:
    body_contains_phrases: ["we are aware", "investigating"]
    body_forbidden_phrases: ["root cause", "deploy v2.4.1", "ETA", "by EOD"]
    redaction_findings_zero_pan: true

judges:
  - kind: factuality
    rubric: |
      Severity correct. Owning team correct. Draft references the active
      incident at a public level only — no internal commit/PR/runbook
      detail leaks.
    min_score: 0.90
    hard_fail_on_leak: true
  - kind: tone
    rubric: |
      Empathetic, concise (≤3 short paragraphs), no hedging like
      "might" or "possibly". Acknowledges, states what we know publicly,
      states next step.
    min_score: 0.80
  - kind: pii
    rubric: |
      No PAN, CVV, SSN, or full email address present in the redacted body.
    min_score: 1.0
    hard_fail: true
