name: trace
version: 1.0.0
description: |
  Cross-system causal timeline for any anchor entity. The single primitive
  every workflow uses for traceability. Walks the knowledge graph from the
  anchor, fuses temporal + dependency + textual signals, and returns a
  ranked timeline with inferred causes.

transport: { kind: internal, service: trace-resolver }

input_schema:
  type: object
  required: [anchor]
  properties:
    anchor:
      type: object
      required: [kind, id]
      properties:
        kind: { enum: [ticket, pr, commit, alert, service, deploy, incident] }
        id:   { type: string }
    window:
      type: object
      properties:
        from:     { type: string, format: date-time }
        to:       { type: string, format: date-time }
        lookback: { type: string, description: "ISO 8601 duration, e.g. P14D" }
    depth: { type: integer, minimum: 1, maximum: 4, default: 2 }

output_schema:
  type: object
  properties:
    timeline:
      type: array
      items:
        type: object
        properties:
          ts:       { type: string, format: date-time }
          kind:     { type: string }
          node_id:  { type: string }
          summary:  { type: string }
          citations: { type: array, items: { type: string } }
    inferred_causes:
      type: array
      items:
        type: object
        properties:
          node_id:    { type: string }
          confidence: { type: number, minimum: 0, maximum: 1 }
          evidence:   { type: array, items: { type: string } }
    citations:
      type: array
      items: { type: string, description: "KnowledgeItem id" }

scopes: [graph:read, retrieval:read]

acl_propagation: caller_identity        # filter timeline by caller's ACL

pii:
  scrub_fields_in_output: []

budget:
  max_calls_per_minute_per_workflow: 30
  max_nodes_returned: 200

observability:
  trace: true
  audit: true
