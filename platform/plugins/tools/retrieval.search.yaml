name: retrieval.search
version: 1.0.0
description: |
  Hybrid retrieval across pgvector (dense) + OpenSearch (BM25) + Neo4j
  (graph hop). ACL-filtered by caller identity.

transport: { kind: internal, service: retrieval-facade }

input_schema:
  type: object
  required: [query]
  properties:
    query: { type: string }
    filters:
      type: object
      properties:
        source: { type: array, items: { type: string } }
        type:   { type: array, items: { enum: [doc, code, ticket, pr, commit, build, log, alert, dashboard, runbook] } }
        owners: { type: array, items: { type: string } }
        time:   { type: object, properties: { from: { type: string }, to: { type: string } } }
    graph_hop:
      type: object
      description: Optional graph expansion from named anchors.
      properties:
        from:     { type: array, items: { type: string } }
        edges:    { type: array, items: { type: string } }
        depth:    { type: integer, default: 1 }
    k: { type: integer, default: 20, maximum: 100 }
    modes:
      type: array
      items: { enum: [dense, lexical, graph] }
      default: [dense, lexical]

output_schema:
  type: object
  properties:
    hits:
      type: array
      items:
        type: object
        properties:
          id:        { type: string }
          score:     { type: number }
          source:    { type: string }
          type:      { type: string }
          title:     { type: string }
          snippet:   { type: string }
          uri:       { type: string }
          provenance: { type: object }

scopes: [retrieval:read]
acl_propagation: caller_identity
budget: { max_calls_per_minute_per_workflow: 200 }
observability: { trace: true, audit: true }
