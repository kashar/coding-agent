name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provision pnpm via the preinstalled npm — proven to work on the runner.
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: cross-package type resolution (e.g. @helmsman/shared) needs the
      # emitted dist/*.d.ts, so typecheck/test/demo must run after the build.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Typecheck packages
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: Test
        run: pnpm --filter @helmsman/core-orchestrator --filter @helmsman/auth-vault --filter @helmsman/workflows run test

      - name: Offline end-to-end demo (Mock engine)
        run: pnpm demo:fixbug

      - name: Build Mission Control
        run: pnpm --filter @helmsman/mission-control run build
