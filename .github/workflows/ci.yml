name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

# TEMPORARY DIAGNOSTIC WORKFLOW.
# Each network-dependent step uses continue-on-error so they ALL run and report,
# revealing exactly which capability the runner lacks (Node download, npm
# registry, pnpm install). Restore the real build/test pipeline once diagnosed.
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: 2. Preinstalled tools
        continue-on-error: true
        run: |
          echo "node: $(node -v 2>&1 || echo MISSING)"
          echo "npm:  $(npm -v 2>&1 || echo MISSING)"
          echo "uname: $(uname -a)"

      - name: 3. Network reachability (preinstalled curl)
        continue-on-error: true
        run: |
          probe() { curl -sS -m 10 -o /dev/null -w "$1 -> HTTP %{http_code} in %{time_total}s\n" "$2" || echo "$1 -> UNREACHABLE"; }
          probe "npm-registry " "https://registry.npmjs.org/"
          probe "nodejs.org   " "https://nodejs.org/dist/index.json"
          probe "github.com   " "https://github.com/"
          probe "objects-cdn  " "https://objects.githubusercontent.com/"

      - name: 4. setup-node@v4 (downloads Node 22)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 5. Node after setup-node
        continue-on-error: true
        run: echo "node now: $(node -v 2>&1 || echo MISSING)"

      - name: 6. Install pnpm via npm
        continue-on-error: true
        run: |
          npm install -g pnpm@10.33.0 && echo "pnpm: $(pnpm -v)" || echo "pnpm install FAILED"

      - name: 7. Frozen install (real dependency fetch)
        continue-on-error: true
        run: pnpm install --frozen-lockfile && echo "INSTALL OK" || echo "INSTALL FAILED"
