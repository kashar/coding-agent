name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is taken from the "packageManager" field in package.json (pnpm@10.33.0).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Test
        run: pnpm --filter @helmsman/core-orchestrator run test

      - name: Offline end-to-end demo (Mock engine)
        run: pnpm demo:fixbug

      - name: Build Mission Control
        run: pnpm --filter @helmsman/mission-control run build
