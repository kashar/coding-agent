name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provision pnpm via the preinstalled npm (most network-light, no corepack
      # signature step, no marketplace action). Version matches packageManager.
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Test
        run: pnpm --filter @helmsman/core-orchestrator run test

      - name: Offline end-to-end demo (Mock engine)
        run: pnpm demo:fixbug

      - name: Build Mission Control
        run: pnpm --filter @helmsman/mission-control run build
